name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Electron and static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check site/js/site.js
          node --check site/js/login.js

      - name: Verify required Windows assets
        shell: bash
        run: |
          test -s assets/app-icon.ico
          test -s assets/app-icon-256.png
          test -s assets/favicon.ico
          test -s electron-builder.yml
          test -s .github/workflows/build-windows.yml

      - name: Verify static HTML routes
        shell: bash
        run: |
          test -s site/index.html
          test -s site/login.html
          test -s site/_redirects
          grep -q '/login /login.html 200' site/_redirects
          grep -q 'login.html' site/sitemap.xml
