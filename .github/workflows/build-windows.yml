name: Build Windows Electron app

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: '300.0.153'

jobs:
  build-windows:
    name: Build Windows installer and portable app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # This step fixes the invalid package version before npm ci/build.
      - name: Fix application version
        shell: pwsh
        run: |
          npm version "$env:APP_VERSION" `
            --no-git-tag-version `
            --allow-same-version `
            --ignore-scripts

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          node -p "'Building application version: ' + require('./package.json').version"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate desktop JavaScript
        shell: pwsh
        run: |
          $files = @(
            "main.js",
            "preload.js",
            "renderer.js"
          )

          foreach ($file in $files) {
            node --check $file

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Build Windows artifacts
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build -- --publish never

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meta-ai-desktop-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release for version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: meta-ai-desktop-windows
          path: release-files

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" release-files/* \
            --verify-tag \
            --generate-notes \
            --title "Meta AI Desktop $GITHUB_REF_NAME"
