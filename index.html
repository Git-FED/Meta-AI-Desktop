<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Meta AI — Screen Only</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <!-- sandbox + screenOnly=true attempts to bypass CSP and show just the screen -->
  <iframe
    src="https://appetize.io/embed/b_vmsfd6j2qw2ffdla37n7taxgdq?screenOnly=true"
    title="Meta AI"
    sandbox="allow-scripts allow-forms allow-same-origin"
    allow="fullscreen; autoplay; clipboard-read; clipboard-write; camera; microphone"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen
  ></iframe>
</body>
</html>
